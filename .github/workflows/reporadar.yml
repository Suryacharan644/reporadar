# Example: how to use the RepoRadar action in your own repository.
# Copy this file into your repo's .github/workflows/ folder and adjust min-score.
name: RepoRadar health

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # weekly, Mondays 06:00 UTC

permissions:
  contents: read
  pull-requests: write # lets the action post and update its PR comment

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: RepoRadar
        uses: ./action
        with:
          min-score: "60"
          comment: "true"
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporadar-report
          path: |
            reporadar-report.json
            reporadar-report.md
          if-no-files-found: ignore
