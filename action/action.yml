name: "RepoRadar health check"
description: "Analyse a repository's health, post an updated report on pull requests, and optionally fail below a minimum score."
author: "RepoRadar contributors"
branding:
  icon: "activity"
  color: "green"

inputs:
  min-score:
    description: "Fail the job when the health score is below this value (0-100). 0 never fails."
    required: false
    default: "0"
  comment:
    description: "Post or update a report comment on pull requests."
    required: false
    default: "true"
  token:
    description: "Token used to read the repository and write PR comments. Needs pull-requests: write for comments."
    required: false
    default: ${{ github.token }}
  python-version:
    description: "Python version used to run the RepoRadar analyser."
    required: false
    default: "3.13"

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install analyser dependencies
      shell: bash
      run: python -m pip install --quiet "httpx==0.28.1"

    - name: Analyse repository health
      shell: bash
      working-directory: ${{ github.action_path }}/../backend
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        REPORADAR_MIN_SCORE: ${{ inputs.min-score }}
        REPORADAR_COMMENT: ${{ inputs.comment }}
        REPORADAR_OUTPUT_DIR: ${{ github.workspace }}
      run: python -m app.action_runner
